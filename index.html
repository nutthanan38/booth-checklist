<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เช็คลิสต์ถ่ายรูป — Back to School สุรินทร์</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#0f1a2e;--card:#162340;--accent1:#f5c842;--accent2:#ff6b35;--accent3:#4fc3f7;--text:#e8edf5;--muted:#7a90b0;--done-bg:#1a3a2a;--done-border:#2ecc71;--radius:14px}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px 16px 40px}.header{text-align:center;margin-bottom:28px}.badge{display:inline-block;background:var(--accent1);color:#0f1a2e;font-family:'Prompt',sans-serif;font-weight:800;font-size:11px;letter-spacing:2px;padding:4px 14px;border-radius:20px;margin-bottom:10px;text-transform:uppercase}h1{font-family:'Prompt',sans-serif;font-weight:800;font-size:26px;line-height:1.2;color:#fff}h1 span{color:var(--accent1)}.subtitle{margin-top:6px;color:var(--muted);font-size:14px}.progress-wrap{background:var(--card);border-radius:var(--radius);padding:16px 18px;margin-bottom:22px;border:1px solid #1e3050}.progress-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px;color:var(--muted)}.progress-label strong{color:var(--accent1);font-size:22px;font-family:'Prompt',sans-serif}.bar-bg{background:#1e3050;border-radius:99px;height:10px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent1));border-radius:99px;transition:width 0.4s;width:0%}.section{margin-bottom:24px}.section-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}.section-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}.section-title{font-family:'Prompt',sans-serif;font-weight:700;font-size:15px;color:#fff}.section-count{margin-left:auto;font-size:12px;color:var(--muted);background:#1e3050;padding:3px 10px;border-radius:20px}.item{background:var(--card);border:1px solid #1e3050;border-radius:12px;margin-bottom:8px;overflow:hidden}.item.done{background:var(--done-bg);border-color:var(--done-border);opacity:.75}.item-label{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}.checkbox{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;background:transparent}.item.done .checkbox{background:var(--done-border);border-color:var(--done-border)}.checkmark{display:none;color:#fff;font-size:13px;font-weight:700}.item.done .checkmark{display:block}.item-text{flex:1}.item-name{font-size:15px;font-weight:600;color:var(--text);line-height:1.4}.item.done .item-name{text-decoration:line-through;color:var(--muted)}.item-tip{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}.priority{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:600;flex-shrink:0;margin-top:3px}.p-must{background:#3d1a1a;color:var(--accent2)}.p-good{background:#1a2f3d;color:var(--accent3)}.reset-btn{display:block;width:100%;margin-top:28px;padding:14px;background:transparent;border:1px solid #1e3050;border-radius:12px;color:var(--muted);font-family:'Sarabun',sans-serif;font-size:14px;cursor:pointer}.all-done{display:none;background:linear-gradient(135deg,#1a3a2a,#0f2d1f);border:1px solid #2ecc71;border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:20px}.all-done.show{display:block}.all-done .emoji{font-size:36px}.all-done h3{font-family:'Prompt',sans-serif;font-size:18px;color:#2ecc71;margin:8px 0 4px}.all-done p{font-size:13px;color:var(--muted)}</style>
</head>
<body>
<div class="header"><div class="badge">📸 Photo Checklist</div><h1>ถ่ายรูปออกบูธ<br><span>Back to School</span> สุรินทร์</h1><p class="subtitle">กดติ๊กทุกรายการที่ถ่ายแล้ว — อย่าลืมไม่ถ่ายไม่ได้นะ!</p></div>
<div class="progress-wrap"><div class="progress-label"><span>ความคืบหน้า</span><strong id="count">0</strong></div><div class="bar-bg"><div class="bar-fill" id="bar"></div></div><div style="text-align:right;font-size:12px;color:var(--muted);margin-top:6px" id="pct">0 / 0 รายการ</div></div>
<div class="all-done" id="allDone"><div class="emoji">🎉</div><h3>ครบทุกรายการแล้ว!</h3><p>กลับบ้านได้เลย อย่าลืมส่งรูปให้ทีมนะ</p></div>
<div id="lists"></div>
<button class="reset-btn" onclick="resetAll()">🔄 เริ่มใหม่ทั้งหมด</button>
<script>const data=[{icon:"🏙️",color:"#2d1f4e",title:"บรรยากาศงานโดยรวม",items:[{name:"ป้ายหน้างาน / ป้ายชื่อร้านค้า",tip:"ต้องเห็นชื่อร้านชัดเจน",must:true},{name:"ภาพรวม Hall / บริเวณจัดงาน",tip:"ถ่ายมุมกว้าง ให้เห็นบูธทั้งหมด",must:true},{name:"ความหนาแน่นของลูกค้าในงาน",tip:"เช้า กลางวัน เย็น",must:false},{name:"ป้ายโปรโมชั่นหน้างาน",tip:"เช่น ลด 20% ทุกบูธ",must:false}]},{icon:"🎪",color:"#1f3a4e",title:"บูธของเราเอง (Domon)",items:[{name:"ภาพบูธเต็มๆ มุมกว้าง",tip:"ให้เห็น layout ทั้งหมด",must:true},{name:"ป้ายชื่อแบรนด์ / โลโก้บูธ",tip:"ต้องชัด อ่านออก",must:true},{name:"การจัดวางสินค้าบนชั้นวาง",tip:"ถ่ายหลายมุม",must:true},{name:"ไฮไลท์สินค้า / Hero Product",tip:"สินค้าที่เราดัน",must:true},{name:"ป้ายราคา / โปรโมชั่นบนบูธ",tip:"ถ่ายให้เห็นตัวเลขชัด",must:true},{name:"มุมมองของลูกค้าที่เข้ามาดู",tip:"ยืนหน้าบูธ ถ่ายไปข้างใน",must:false},{name:"รูปทีมงาน / พนักงานหน้าบูธ",tip:"เอาไว้ใช้ post IG / LINE",must:false},{name:"ลูกค้ากำลังหยิบสินค้า",tip:"ถ้าลูกค้าอนุญาต",must:false}]},{icon:"🔍",color:"#1f3d2a",title:"สินค้าของเราแบบ Close-up",items:[{name:"สินค้า bestseller ระยะใกล้",tip:"โฟกัสชัด แสงดี",must:true},{name:"บรรจุภัณฑ์ / แพ็กเกจสวยๆ",tip:"มุม 3/4 หรือ flat lay",must:true},{name:"ป้ายแท็กราคา ติดสินค้าจริง",tip:"ตรวจสอบราคาขายหน้าร้าน",must:true},{name:"กลุ่มสินค้า Back to School",tip:"เครื่องเขียน กระเป๋า สมุด",must:true}]},{icon:"🕵️",color:"#3d2a1a",title:"คู่แข่ง / บูธอื่นในงาน",items:[{name:"ภาพรวมบูธคู่แข่งหลัก 2-3 เจ้า",tip:"ถ่ายมุมกว้าง",must:true},{name:"การจัดวางสินค้าของคู่แข่ง",tip:"สังเกตว่าเค้าจัดยังไง",must:true},{name:"ป้ายราคาของคู่แข่ง",tip:"ถ่ายให้เห็นตัวเลข",must:true},{name:"สินค้าที่คล้ายกับเราของคู่แข่ง",tip:"เปรียบเทียบราคา + packaging",must:true},{name:"บูธที่มีลูกค้ายืนดูเยอะ",tip:"บูธไหนดึงดูดคน?",must:false},{name:"โปรโมชั่นพิเศษของคู่แข่ง",tip:"ซื้อ 5 แถม 1 ฯลฯ",must:false}]},{icon:"🌟",color:"#2a1f3d",title:"ข้อมูลเพิ่มเติม / Insight",items:[{name:"Trend สินค้าที่เห็นบ่อยในงาน",tip:"ประเภทไหนหลายบูธมาก?",must:false},{name:"การตกแต่งธีมที่โดดเด่น",tip:"ใครจัดสวยที่สุด?",must:false},{name:"Signage / วัสดุตกแต่งบูธ",tip:"ผ้า โฟม บอร์ด",must:false},{name:"ภาพงานตอนชั่วโมงเร่ง",tip:"10.00-12.00 และ 14.00-16.00",must:false}]}];let state={},total=0;function init(){data.forEach((s,si)=>{s.items.forEach((_,ii)=>{state[si+'-'+ii]=false;total++;});});render();}function render(){const c=document.getElementById('lists');c.innerHTML='';data.forEach((sec,si)=>{const el=document.createElement('div');el.className='section';const dc=sec.items.filter((_,ii)=>state[si+'-'+ii]).length;el.innerHTML='<div class="section-header"><div class="section-icon" style="background:'+sec.color+'">'+sec.icon+'</div><div class="section-title">'+sec.title+'</div><div class="section-count">'+dc+'/'+sec.items.length+'</div></div>';sec.items.forEach((item,ii)=>{const k=si+'-'+ii,done=state[k],d=document.createElement('div');d.className='item'+(done?' done':'');d.innerHTML='<label class="item-label"><div class="checkbox"><span class="checkmark">✓</span></div><div class="item-text"><div class="item-name">'+item.name+'</div>'+(item.tip?'<div class="item-tip">💡 '+item.tip+'</div>':'')+'</div>'+(item.must?'<span class="priority p-must">ห้ามลืม</span>':'<span class="priority p-good">ถ้าได้</span>')+'</label>';d.querySelector('.item-label').addEventListener('click',()=>toggle(si,ii));el.appendChild(d);});c.appendChild(el);});updateProgress();}function toggle(si,ii){state[si+'-'+ii]=!state[si+'-'+ii];render();}function updateProgress(){const done=Object.values(state).filter(Boolean).length,pct=total>0?Math.round((done/total)*100):0;document.getElementById('count').textContent=done;document.getElementById('bar').style.width=pct+'%';document.getElementById('pct').textContent=done+' / '+total+' รายการ';document.getElementById('allDone').classList.toggle('show',done===total);}function resetAll(){if(!confirm('รีเซ็ตทั้งหมดใช่ไหม?'))return;Object.keys(state).forEach(k=>state[k]=false);render();}init();</script>
</body>
</html>
